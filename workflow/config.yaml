output_dir: "results"

execution:
  # local: run ../main.py directly
  # docker: run the metaxtract Docker image
  # apptainer/singularity: run the metaxtract .sif image
  mode: "local"
  metaxtract_root: ".."
  docker_image: "metaxtract:latest"
  apptainer_image: "../metaxtract.sif"

inputs:
  # local: use files listed below
  # pride: download RAW files from PRIDE using the pride section
  mode: "local"
  local_files:
    - "../data/small.RAW"

pride:
  url: "ftp://ftp.pride.ebi.ac.uk/pride/data/archive"
  year: 2025
  month: 1
  max_files: 2
  copy_dir: "results/data"

metaxtract:
  outputs:
    file_based_details: true
    ms_method: false
    lc_method: false
    ms2_peaklist_export: true
    ms1_peaklist_export: true
    ms2_technical_details_export: false
    ms1_technical_details_export: false
    hdf5_export: false

  scan_header:
    MS1:
      select_all: true
      columns:
        Ion Injection Time (ms): true
        Total Number of Peaks: true
        Total Ion Current: true
        Scan Start Time (min): true
        Base Peak Intensity: true
        Base Peak m/z: true
        Scan Mode: true
        thermo_Multi Inject Info: true
        thermo_Multiple Injection: true
    MS2:
      select_all: true
      columns:
        Total Ion Current: true
        Total Number of Peaks: true
        Scan Start Time (min): true
        Base Peak Intensity: true
        Base Peak m/z: true
        Selected Ion Intensity: true
        Filter String: true
        Scan Mode: true

  visualisation:
    enabled: true
    format: html
